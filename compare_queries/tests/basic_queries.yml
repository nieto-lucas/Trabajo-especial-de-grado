# Problema:
#
# No pude imitar cpg.cfgNode directamente, así que termine tratando de imitar Cypher
# desde Joern. El problema radica en que Joern considera como nodos CFG algunos completamente
# aislados
#
# Por ejemplo, con el archivo "foo.c":
#
# `cpg.cfgNode.filter(n => n.cfgNext.isEmpty && n.cfgPrev.isEmpty).length` da un total de 
# 29 nodos aislados que Joern clasifica internamente como parte del CFG
#
- name: generic_all_cfg_nodes
  joern: cpg.all.filter(n => n.outE("CFG").hasNext || n.inE("CFG").hasNext)
  cypher: MATCH (n)-[r:CFG]->(m) RETURN n, m;

- name: generic_all_ast_nodes
  joern: cpg.astNode
  cypher: MATCH (n)-[r:AST]->(m) RETURN n, m;

- name: generic_methods_with_param_count_1
  joern: cpg.method.filter(_.parameter.size == 1)
  cypher: >
    MATCH (n:METHOD)-[:AST]->(m:METHOD_PARAMETER_IN)
    WITH n, count(m) AS c
    WHERE c = 1
    RETURN n;
